<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menú familiar</title>
  <meta name="description" content="Planifica las comidas de la semana con vuestros platos de siempre, por colores, y alguna idea nueva de vez en cuando.">
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menú familiar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Menú familiar</h1>
    <div class="actions" id="actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="semana"><span class="tab-ic" aria-hidden="true">📅</span>Semana</button>
    <button type="button" data-tab="compra"><span class="tab-ic" aria-hidden="true">🛒</span>Compra</button>
    <button type="button" data-tab="platos"><span class="tab-ic" aria-hidden="true">📖</span>Mis platos</button>
    <button type="button" data-tab="familia"><span class="tab-ic" aria-hidden="true">👨‍👩‍👧</span>Familia</button>
    <button type="button" data-tab="ideas"><span class="tab-ic" aria-hidden="true">✨</span>Ideas</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Al publicar una versión nueva, sube el número de ?v= en todos (y en APP_VERSION de app.js) -->
  <script src="platos.js?v=14"></script>
  <script src="familia.js?v=14"></script>
  <script src="compra.js?v=14"></script>
  <script src="recetas.js?v=14"></script>
  <script src="dibujos.js?v=14"></script>
  <script src="miembros.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
